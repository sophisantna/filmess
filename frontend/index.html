<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Filme</title>
</head>
<body>
    <h1> Filme Sophia Santana e Daniel halley </h1>
    <section class="filmes">

        <div>
            <h2>Titulo</h2>
            <p><strong>Genereo</strong></p>
            <p><strong>Duracao</strong></p>
            <p><strong>Classificação</strong></p>
        </div>
    </section>

<script>
        async function buscarFilmes() {
        // acessar a rota GET do backend, trazer os filmes e mostrar os filmes na tela
        const resposta = await fetch("http://localhost:3000") // resposta do backend
        const filmes = await resposta.json() // converte a resposta num objeto JS
        const sectionFilmes = document.querySelector(".filmes")
    
        filmes.forEach((filme) => {
            console.log(filme)
            sectionFilmes.innerHTML += `
                        <div>
                            <h2>${filme.title}</h2>
                            <p><strong>Gênero:</strong> ${filme.gender}</p>
                            <p><strong>Duração:</strong> ${filme.duration} minutos</p>
                            <p><strong>Classificação indicativa:</strong> ${filme.ageLimit > 0 ? filme.ageLimit + ' anos' : 'Livre'}</p>
                        </div>
                    `
        })
    }
    
    buscarFilmes()
</script>

 
</body>
</html>
